[package]
name = "storyor"
version = "0.1.0"
edition = "2024"

[dependencies]
axfetchum = { version = "0.1.4", features = ["axum"] }
axum = "0.8.4"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
hound = "3.5.1"
inventory = "0.3"
llm = {
  version = "1.3.8",
  default-features = false,
  features = ["logging", "openai", "rustls-tls"]
}
noyalib = "0.0.11"
regex = "1.12.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = {
  version = "0.23.41",
  default-features = false,
  features = ["ring", "std"]
}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
symphonia = { version = "0.6.0", default-features = false, features = ["mp3"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tower = "0.5.2"
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
uuid = { version = "1.16.0", features = ["v4", "serde"] }

[dev-dependencies]
async-trait = "0.1.89"
tempfile = "3.27.0"
